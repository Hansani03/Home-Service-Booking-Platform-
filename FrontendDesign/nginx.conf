server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /booking-api/ {
        proxy_pass http://booking-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /provider-api/ {
        proxy_pass http://provider-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /notification-api/ {
        proxy_pass http://notification-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
