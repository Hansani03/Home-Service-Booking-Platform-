spring.application.name=booking
server.port=8081

# XAMPP / phpMyAdmin - MariaDB on localhost
spring.datasource.url=jdbc:mysql://localhost:3306/homeservice_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Other microservice URLs
provider.service.url=http://localhost:8082
notification.service.url=http://localhost:8083
